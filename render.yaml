services:
  - type: web
    name: drupal-carros
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: drupal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: drupal-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: drupal-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: drupal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: drupal-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: drupal-db
          property: connectionString

databases:
  - name: drupal-db
    plan: free
    databaseName: drupal
    user: drupal
